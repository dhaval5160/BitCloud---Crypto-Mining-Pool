name: cloud_mining_farm
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 2.0.3+7

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.2
  lottie: ^3.3.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  velocity_x: ^4.3.1
  font_awesome_flutter: ^11.0.0
  animated_flip_counter: ^0.3.4
  flutter_easyloading: ^3.0.5
  encrypt: ^5.0.3
  http: ^1.4.0
  google_sign_in: ^6.3.0
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.6
  flutter_local_notifications: ^19.2.1
  firebase_remote_config: ^5.4.4
  firebase_analytics: ^11.4.6
  firebase_auth: ^5.5.4
  app_settings: ^9.0.1
  permission_handler: ^12.0.0+1
  google_mobile_ads: ^9.2.0
  gma_mediation_meta: ^1.7.1
  share_plus: ^11.0.0
  package_info_plus: ^8.3.0
  flutter_rating_bar: ^4.0.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.13.0
  smooth_page_indicator: ^1.2.1
  connectivity_plus: ^6.0.5
  device_info_plus: 11.3.0
  in_app_update: ^4.2.3
  in_app_purchase: ^3.3.1
  in_app_purchase_android: ^0.5.5
  flutter_email_sender: ^11.2.0
  wakelock_plus: ^1.3.2
  intl:
  flutter_fgbg: ^0.7.1
  animated_text_kit: ^4.3.0
  animated_bottom_navigation_bar: ^1.4.0
  shimmer: ^3.0.0
  gradient_borders: ^1.0.2
  flutter_native_splash: ^2.4.7
  visibility_detector: ^0.4.0+2


dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1


flutter:


  uses-material-design: true

  assets:
    - asset/image/
    - asset/icon/
    - asset/lottie/


  fonts:
    - family: Roboto
      fonts:
        - asset: asset/font/roboto/Roboto-Light.ttf
          weight: 300
        - asset: asset/font/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: asset/font/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: asset/font/roboto/Roboto-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: asset/font/montserrat/Montserrat-Light.ttf
          weight: 300
        - asset: asset/font/montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: asset/font/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: asset/font/montserrat/Montserrat-Bold.ttf
          weight: 700
    - family: Poppins
      fonts:
        - asset: asset/font/poppins/Poppins-Light.ttf
          weight: 300
        - asset: asset/font/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: asset/font/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: asset/font/poppins/Poppins-Bold.ttf
          weight: 700


flutter_native_splash:
  color: "#000000"
  image: asset/image/ic_launcher.png

  android_12:
    image: asset/image/ic_launcher.png
    color: "#000000"
    icon_background_color: "#000000"